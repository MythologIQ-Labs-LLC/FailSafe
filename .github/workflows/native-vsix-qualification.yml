name: Native VSIX Platform Qualification

# #502: qualifies platform-targeted VSIXs. better-sqlite3 13.x is N-API and ships one
# prebuild per platform, so each target packages exactly its own binary
# (scripts/package-target.cjs) and validate-vsix checks the binary's header against
# the target. Node 22: the 13.x prebuilds require it (they segfault on Node 20).
# Manual dispatch only, to preserve the Actions budget. Not a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-latest
            target: alpine-x64
            smoke: none
          - os: windows-latest
            target: win32-x64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: FailSafe/extension
        run: npm ci
      - name: Compile extension
        working-directory: FailSafe/extension
        run: npm run compile
      - name: Package target-specific extension
        working-directory: FailSafe/extension
        run: node scripts/package-target.cjs ${{ matrix.target }} --out qualification-${{ matrix.target }}.vsix
      - name: Validate packaged extension (binary header must match the target)
        working-directory: FailSafe/extension
        run: node scripts/validate-vsix.cjs qualification-${{ matrix.target }}.vsix
      - name: Load the packaged binary (not node_modules) on its native runner
        if: matrix.smoke != 'none'
        working-directory: FailSafe/extension
        shell: bash
        run: |
          rm -rf vsix-extract && mkdir vsix-extract
          unzip -q qualification-${{ matrix.target }}.vsix -d vsix-extract
          node -e "const D=require('./vsix-extract/extension/node_modules/better-sqlite3'); const db=new D(':memory:'); db.exec('create table t(x)'); db.prepare('insert into t values (?)').run(1); if (db.prepare('select x from t').get().x !== 1) process.exit(1); db.close(); console.log('packaged binary loads on', process.platform, process.arch);"
      - name: Upload qualification artifact (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ matrix.target }}
          path: FailSafe/extension/qualification-${{ matrix.target }}.vsix
          if-no-files-found: error
