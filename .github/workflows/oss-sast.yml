name: OSS SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Community Edition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned open-source scanner
        run: python -m pip install semgrep==1.169.0
      - name: Scan production sources for blocking security findings
        id: scan
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >-
          semgrep scan
          --config p/security-audit
          --severity ERROR
          --error
          --metrics off
          --json
          --output semgrep.json
          FailSafe/extension/src
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-community-results
          path: semgrep.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce clean OSS SAST
        if: steps.scan.outcome != 'success'
        run: |
          echo '::error::Semgrep Community Edition found a blocking security finding or failed to scan. Review semgrep-community-results.'
          exit 1

  command-boundary-hardening:
    name: Commit command-boundary hardening
    if: >-
      github.repository == 'MythologIQ-Labs-LLC/FailSafe' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 267 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/security-codeql-cross-platform'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/security-codeql-cross-platform
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Apply fail-closed command runner changes
        run: python scripts/harden-command-runners.py
      - name: Install and validate TypeScript surface
        working-directory: FailSafe/extension
        run: |
          npm ci
          npm run compile
          npm run lint
      - name: Restore workflows and commit exact hardening set
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/oss-sast.yml .github/workflows/pr-full-test.yml
          git rm scripts/harden-command-runners.py
          git add \
            .github/workflows/oss-sast.yml \
            .github/workflows/pr-full-test.yml \
            FailSafe/extension/src/governance/revert/GitResetService.ts \
            FailSafe/extension/src/integrations/agent-cli/agent-cli-core.ts \
            FailSafe/extension/src/integrations/bicameral/install-detector.ts \
            FailSafe/extension/src/qorlogic/PythonInterpreterResolver.ts \
            FailSafe/extension/src/qorlogic/QorLogicPackageInstaller.ts \
            FailSafe/extension/src/roadmap/services/AdapterService.ts \
            FailSafe/extension/src/roadmap/services/MarketplaceInstaller.ts \
            FailSafe/extension/src/roadmap/services/SecurityScanner.ts \
            FailSafe/extension/src/shared/gitBootstrap.ts \
            FailSafe/extension/src/test/governance/revert/GitResetService.test.ts \
            FailSafe/extension/src/test/qorlogic/PythonInterpreterResolver.test.ts
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/oss-sast.yml
            .github/workflows/pr-full-test.yml
            FailSafe/extension/src/governance/revert/GitResetService.ts
            FailSafe/extension/src/integrations/agent-cli/agent-cli-core.ts
            FailSafe/extension/src/integrations/bicameral/install-detector.ts
            FailSafe/extension/src/qorlogic/PythonInterpreterResolver.ts
            FailSafe/extension/src/qorlogic/QorLogicPackageInstaller.ts
            FailSafe/extension/src/roadmap/services/AdapterService.ts
            FailSafe/extension/src/roadmap/services/MarketplaceInstaller.ts
            FailSafe/extension/src/roadmap/services/SecurityScanner.ts
            FailSafe/extension/src/shared/gitBootstrap.ts
            FailSafe/extension/src/test/governance/revert/GitResetService.test.ts
            FailSafe/extension/src/test/qorlogic/PythonInterpreterResolver.test.ts
            scripts/harden-command-runners.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${changed[*]}" == "${expected_sorted[*]}" ]] || {
            printf 'Unexpected staged paths:\n%s\n' "${changed[*]}"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: harden command execution boundaries'
          git push origin HEAD:feat/security-codeql-cross-platform
