name: PR Full Test

# Runs the complete test suite (lint + extension-host mocha + Playwright UI,
# against the PINNED VS Code version)
# on every PR targeting main. Before this gate, `test:all` ran ONLY on the
# Release Pipeline (tag push), so native-build and UI-test regressions were
# invisible until a tag fired — the exact gap that dead-tagged v5.4.0 (a stale
# Integrations pill-count Playwright assertion that the standards-only PR gate
# never exercised). Running it here surfaces those failures at PR time, before
# they reach main and before any release tag.
on:
  pull_request:
    branches: [main]

# A newer push to the same PR cancels the in-flight run (the full suite is slow;
# no value finishing a stale commit).
concurrency:
  group: pr-full-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least-privilege default token: these gates only read the repo and
# build/validate; none mutate repo state. #90 supply-chain baseline.
permissions:
  contents: read

jobs:
  full-test:
    name: Full Test Suite (test:all)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: FailSafe/extension
      # CI-ONLY source proof: use real registry archives under exact SHA-512 pins
      # to compare six committed voice browser assets against upstream bytes.
      # This step is temporary on this test branch and must not merge.
      - name: Verify upstream voice asset pins against committed Git HEAD
        run: npm run verify:voice-pins
        working-directory: FailSafe/extension
      # CI-ONLY real producer acceptance: no tag, release or publication.
      - name: Build and read back real six-asset Voice Pack candidate
        shell: bash
        working-directory: FailSafe/extension
        run: |
          set -euo pipefail
          npm run build:package
          node <<'NODE'
          const fs = require('fs'), path = require('path');
          const cp = require('child_process'), crypto = require('crypto'), assert = require('assert/strict');
          const version = require('./package.json').version;
          const name = 'failsafe-voice-pack-' + version + '.tar.gz';
          const archive = path.join('dist', name);
          const sum = fs.readFileSync(archive + '.sha256', 'utf8');
          const actual = crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
          assert.equal(sum, actual + '  ' + name + '\n');
          const tar = (args) => {
            const p = cp.spawnSync('tar', args, {encoding: null, maxBuffer: 80 * 1024 * 1024});
            if (p.status !== 0 || p.error) throw Error('tar readback refused: ' + String(p.stderr));
            return p.stdout;
          };
          const listed = tar(['-tzf', archive]).toString('utf8').trim().split('\n')
            .map(s => s.replace(/^\.\//, '')).sort();
          const members = ['piper/', 'whisper/', 'voice-pack.manifest.json',
            'piper/piper.min.js', 'piper/piper_phonemize.wasm',
            'piper/piper_phonemize.data', 'whisper/transformers.min.js',
            'whisper/ort-wasm-simd.wasm', 'whisper/ort-wasm-simd-threaded.wasm'];
          assert.deepEqual(listed, members.sort());
          const manifest = JSON.parse(tar(['-xOzf', archive, 'voice-pack.manifest.json']).toString('utf8'));
          assert.equal(manifest.version, version);
          assert.deepEqual([...manifest.expectedFiles].sort(), members.filter(x=>!x.endsWith('/')&&x!=='voice-pack.manifest.json').sort());
          assert.deepEqual(Object.keys(manifest.sha256).sort(), manifest.expectedFiles);
          for (const member of manifest.expectedFiles) {
            const asset = tar(['-xOzf', archive, member]);
            assert.ok(asset.length>0);
            assert.equal(crypto.createHash('sha256').update(asset).digest('hex'), manifest.sha256[member]);
          }
          console.log('[voice proof] REAL ARCHIVE PASS: version', version, 'six matched assets, exact 9 entries, SHA-256');
          NODE
      - run: npx playwright install --with-deps chromium
        working-directory: FailSafe/extension
      - run: npm run compile
        working-directory: FailSafe/extension
      - name: Run complete suite with bounded transport retry
        shell: bash
        working-directory: FailSafe/extension
        run: |
          set -o pipefail
          set +e
          xvfb-run -a npm run test:all 2>&1 | tee full-test.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ ${status} -ne 0 ]] && grep -Eq 'ECONNRESET|Error downloading|Error: aborted' full-test.log; then
            echo 'Pinned VS Code transport failed; retrying the complete suite once.' | tee -a full-test.log
            set +e
            xvfb-run -a npm run test:all 2>&1 | tee -a full-test.log
            status=${PIPESTATUS[0]}
            set -e
          fi

          exit ${status}
      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-test-diagnostics
          path: FailSafe/extension/full-test.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload Playwright report on failure
        if: ${{ failure() && hashFiles('FailSafe/extension/playwright-report/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: FailSafe/extension/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
