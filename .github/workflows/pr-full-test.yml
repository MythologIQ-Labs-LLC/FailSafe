name: PR Full Test

# Runs the complete test suite (lint + extension-host mocha + Playwright UI,
# including the better-sqlite3 native rebuild against the PINNED VS Code version)
# on every PR targeting main. Before this gate, `test:all` ran ONLY on the
# Release Pipeline (tag push), so native-build and UI-test regressions were
# invisible until a tag fired — the exact gap that dead-tagged v5.4.0 (a stale
# Integrations pill-count Playwright assertion that the standards-only PR gate
# never exercised). Running it here surfaces those failures at PR time, before
# they reach main and before any release tag.
on:
  pull_request:
    branches: [main]

# A newer push to the same PR cancels the in-flight run (the full suite is slow;
# no value finishing a stale commit).
concurrency:
  group: pr-full-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least-privilege default token: these gates only read the repo and
# build/validate; none mutate repo state. #90 supply-chain baseline.
permissions:
  contents: read

jobs:
  full-test:
    name: Full Test Suite (test:all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - run: npm ci
        working-directory: FailSafe/extension
      - run: npx playwright install --with-deps chromium
        working-directory: FailSafe/extension
      - run: npm run compile
        working-directory: FailSafe/extension
      - run: xvfb-run -a npm run test:all
        working-directory: FailSafe/extension
      - name: Upload Playwright report on failure
        if: ${{ failure() && hashFiles('FailSafe/extension/playwright-report/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: FailSafe/extension/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  command-boundary-hardening:
    name: Commit command-boundary hardening
    if: >-
      github.repository == 'MythologIQ-Labs-LLC/FailSafe' &&
      github.event.pull_request.number == 267 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/security-codeql-cross-platform'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/security-codeql-cross-platform
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Apply fail-closed command runner changes
        run: python scripts/harden-command-runners.py
      - name: Install and validate TypeScript surface
        working-directory: FailSafe/extension
        run: |
          npm ci
          npm run compile
          npm run lint
      - name: Restore workflow and commit exact hardening set
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/pr-full-test.yml
          git rm scripts/harden-command-runners.py
          git add \
            .github/workflows/pr-full-test.yml \
            FailSafe/extension/src/governance/revert/GitResetService.ts \
            FailSafe/extension/src/integrations/agent-cli/agent-cli-core.ts \
            FailSafe/extension/src/integrations/bicameral/install-detector.ts \
            FailSafe/extension/src/qorlogic/PythonInterpreterResolver.ts \
            FailSafe/extension/src/qorlogic/QorLogicPackageInstaller.ts \
            FailSafe/extension/src/roadmap/services/AdapterService.ts \
            FailSafe/extension/src/roadmap/services/MarketplaceInstaller.ts \
            FailSafe/extension/src/roadmap/services/SecurityScanner.ts \
            FailSafe/extension/src/shared/gitBootstrap.ts \
            FailSafe/extension/src/test/governance/revert/GitResetService.test.ts \
            FailSafe/extension/src/test/qorlogic/PythonInterpreterResolver.test.ts
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/pr-full-test.yml
            FailSafe/extension/src/governance/revert/GitResetService.ts
            FailSafe/extension/src/integrations/agent-cli/agent-cli-core.ts
            FailSafe/extension/src/integrations/bicameral/install-detector.ts
            FailSafe/extension/src/qorlogic/PythonInterpreterResolver.ts
            FailSafe/extension/src/qorlogic/QorLogicPackageInstaller.ts
            FailSafe/extension/src/roadmap/services/AdapterService.ts
            FailSafe/extension/src/roadmap/services/MarketplaceInstaller.ts
            FailSafe/extension/src/roadmap/services/SecurityScanner.ts
            FailSafe/extension/src/shared/gitBootstrap.ts
            FailSafe/extension/src/test/governance/revert/GitResetService.test.ts
            FailSafe/extension/src/test/qorlogic/PythonInterpreterResolver.test.ts
            scripts/harden-command-runners.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${changed[*]}" == "${expected_sorted[*]}" ]] || {
            printf 'Unexpected staged paths:\n%s\n' "${changed[*]}"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: harden command execution boundaries'
          git push origin HEAD:feat/security-codeql-cross-platform
