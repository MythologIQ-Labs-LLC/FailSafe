name: Release Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      diff_category:
        description: "Change category for SemVer bump validation"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - fix
          - feature
          - breaking

# Least-privilege default for the whole pipeline. Publish jobs authenticate via
# environment secrets (VSCE_PAT / OVSX_TOKEN), not GITHUB_TOKEN, so read is
# sufficient for them. The github-release job re-grants `contents: write`
# per-job (it creates the Release object). #90 supply-chain baseline.
permissions:
  contents: read

# FX974: runs for one tag never overlap. A second run waits until the first has
# finished, so its build job sees the first run's publish history (LD7).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: SemVer 2.0.0 Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history needed for tag comparison
      - name: Verify tag is on main branch
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
          if ! git merge-base --is-ancestor $TAG_COMMIT origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on main branch. Merge your release/hotfix branch to main first, then tag."
            exit 1
          fi
          echo "✅ Tag ${{ github.ref_name }} verified on main branch"
      - name: Validate SemVer 2.0.0 compliance
        shell: pwsh
        run: |
          tools/validate-release-version.ps1 `
            -Version '${{ github.ref_name }}' `
            -DiffCategory '${{ inputs.diff_category || 'none' }}'

  build:
    name: Build & Test
    needs: validate
    runs-on: ubuntu-latest
    # The one-set guard reads this tag's Actions history (a job-level block
    # replaces the workflow default, so contents: read is listed again).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository validation gate
        shell: pwsh
        run: ./scripts/validate.ps1 -Version ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # better-sqlite3 13 declares engines.node >=22; npm silently skips the
          # optional dependency on Node 20 and every target package would fail (#502).
          node-version: "22"
      - run: npm ci
        working-directory: FailSafe/extension
      - run: npx playwright install --with-deps chromium
        working-directory: FailSafe/extension
      - run: npm run compile
        working-directory: FailSafe/extension
      - run: xvfb-run -a npm run test:all
        working-directory: FailSafe/extension
      - name: Export governance context
        if: always()
        continue-on-error: true
        run: bash tools/export-governance-context.sh .failsafe-ci-context
      - name: Upload governance context
        if: ${{ always() && hashFiles('.failsafe-ci-context/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-context
          path: .failsafe-ci-context/
          if-no-files-found: ignore
          retention-days: 30
      - name: Release metadata preflight
        run: node ./scripts/validate-vsix.cjs --source-only
        working-directory: FailSafe/extension
      - name: Derive release version from tag
        run: echo "VSIX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # FX974: a second build for a tag produces different bytes, and
      # --skip-duplicate would then leave the marketplaces on the first set or a
      # mix of both. On every run, refuse to build once any attempt for this tag
      # has started publishing (Actions history, which does not lag the way a
      # marketplace 404 does), a marketplace serves the version, or a Release
      # exists. See docs/RELEASE_RECOVERY.md.
      - name: Refuse to rebuild a version that is already published
        working-directory: FailSafe/extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.cjs already-published --version "${VSIX_VERSION}" --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --self-step "Refuse to rebuild a version that is already published"
      # #502: the extension depends on a native SQLite binary, so it ships as one
      # platform-targeted VSIX per supported target, never a universal VSIX. The
      # script packages every target, validates each binary header against its
      # target, and fails the job if any target is missing or invalid.
      - name: Package and validate the target VSIX set
        run: node scripts/package-all-targets.cjs --out dist-vsix --version "${VSIX_VERSION}"
        working-directory: FailSafe/extension
      - name: Assert the complete target set
        working-directory: FailSafe/extension/dist-vsix
        run: |
          set -euo pipefail
          count=$(node -p "require('./targets.json').targets.length")
          test "${count}" -eq 8
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-targets
          path: FailSafe/extension/dist-vsix/
          if-no-files-found: error
          # Re-run failed jobs, and the manual recovery, reuse this exact set.
          retention-days: 90

  publish-vscode:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    # Gate: requires a reviewer to approve the `production` environment before
    # publish fires. Configure required reviewers under
    # Repository Settings → Environments → production.
    environment: production
    steps:
      - name: Derive release version from tag
        run: echo "VSIX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-targets
          path: vsix-targets
      # FX974: the tag must still point at the commit this run built (a tag
      # moved while the run waited for approval stops here), and the full set
      # check (exact names, no other package, manifest target and version,
      # native binary) runs before anything is published.
      - name: Check the tag still points at the built commit
        working-directory: FailSafe/extension
        run: node scripts/release-artifacts.cjs check-tag --tag "${GITHUB_REF_NAME}"
      - name: Verify the authoritative target set
        working-directory: FailSafe/extension
        run: node scripts/release-artifacts.cjs verify-set "${GITHUB_WORKSPACE}/vsix-targets" --version "${VSIX_VERSION}"
      - name: Verify the target set before publishing
        working-directory: vsix-targets
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 8
          for f in *.vsix; do
            case "${f}" in
              mythologiq-failsafe-"${VSIX_VERSION}"-*.vsix) ;;
              *) echo "::error::${f} is not a ${VSIX_VERSION} target VSIX"; exit 1 ;;
            esac
          done
      # Each target is a separate marketplace upload; --skip-duplicate makes a
      # re-run after a partial failure publish only the targets still missing.
      - name: Publish every target VSIX
        working-directory: vsix-targets
        run: |
          set -euo pipefail
          for f in $(awk '{print $2}' SHA256SUMS.txt); do
            echo "Publishing ${f}"
            npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate --packagePath "${f}"
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    # Same manual-approval gate as publish-vscode. Both publish jobs sit
    # behind the `production` environment so a reviewer must approve before
    # either marketplace receives the new VSIX.
    environment: production
    steps:
      - name: Derive release version from tag
        run: echo "VSIX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-targets
          path: vsix-targets
      # FX974: the tag must still point at the commit this run built (a tag
      # moved while the run waited for approval stops here), and the full set
      # check (exact names, no other package, manifest target and version,
      # native binary) runs before anything is published.
      - name: Check the tag still points at the built commit
        working-directory: FailSafe/extension
        run: node scripts/release-artifacts.cjs check-tag --tag "${GITHUB_REF_NAME}"
      - name: Verify the authoritative target set
        working-directory: FailSafe/extension
        run: node scripts/release-artifacts.cjs verify-set "${GITHUB_WORKSPACE}/vsix-targets" --version "${VSIX_VERSION}"
      - name: Verify the target set before publishing
        working-directory: vsix-targets
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 8
          for f in *.vsix; do
            case "${f}" in
              mythologiq-failsafe-"${VSIX_VERSION}"-*.vsix) ;;
              *) echo "::error::${f} is not a ${VSIX_VERSION} target VSIX"; exit 1 ;;
            esac
          done
      # Each target is a separate marketplace upload; --skip-duplicate makes a
      # re-run after a partial failure publish only the targets still missing.
      - name: Publish every target VSIX
        working-directory: vsix-targets
        run: |
          set -euo pipefail
          for f in $(awk '{print $2}' SHA256SUMS.txt); do
            echo "Publishing ${f}"
            npx --yes ovsx@1.2.0 publish --skip-duplicate "${f}"
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}

  # Create the GitHub Release once BOTH marketplaces have the packages, so the
  # Releases page stays in lockstep with what actually shipped (before v5.4.2
  # tags and marketplaces advanced while Releases froze at v4.8.0). Gated behind
  # the publish jobs, which sit behind the `production` reviewer gate, so an
  # unapproved or dead tag never produces a Release.
  #
  # FX974: the Release carries the same eight target packages and SHA256SUMS.txt
  # the marketplaces received (the one vsix-targets artifact; nothing is rebuilt
  # or re-hashed per destination). It waits until both marketplaces serve those
  # exact bytes, then attaches them to a draft, uploading only missing files and
  # never replacing one, and publishes the draft only when all nine match. A
  # re-run of this job resumes from whatever is already there.
  github-release:
    name: Create GitHub Release
    needs: [publish-vscode, publish-openvsx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-targets
          path: vsix-targets
      - name: Derive release version from tag
        run: echo "VSIX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Verify the target set before attaching it
        working-directory: FailSafe/extension
        run: node scripts/release-artifacts.cjs verify-set "${GITHUB_WORKSPACE}/vsix-targets" --version "${VSIX_VERSION}"
      # Both marketplaces must serve exactly these bytes before the Release
      # carries them (Open VSX can take about 40 minutes to serve a new version).
      - name: Wait until both marketplaces serve these exact packages
        working-directory: FailSafe/extension
        run: node scripts/verify-release-provenance.cjs --version "${VSIX_VERSION}" --sums "${GITHUB_WORKSPACE}/vsix-targets/SHA256SUMS.txt" --vscode --openvsx --wait 3600
      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the "## [VERSION] ..." section body from the root CHANGELOG.
          awk -v ver="[$VERSION]" '
            index($0, "## " ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION; will fall back to auto-generated notes." >&2
          fi
      - name: Attach the set to the GitHub Release and publish it
        working-directory: FailSafe/extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.cjs publish-release "${GITHUB_WORKSPACE}/vsix-targets" --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes "${GITHUB_WORKSPACE}/release-notes.md"
