name: Repo Standards Enforcement

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - "plan/**"
      - "feat/**"
      - "fix/**"
      - "release/**"
      - "hotfix/**"

# Least-privilege default token: these gates only read the repo and
# build/validate; none mutate repo state. #90 supply-chain baseline.
permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: FailSafe/extension
        run: npm ci

      - name: Branch policy
        shell: pwsh
        run: |
          pwsh -File tools/reliability/validate-branch-policy.ps1

      - name: Lint
        working-directory: FailSafe/extension
        run: npm run lint

      - name: Compile
        working-directory: FailSafe/extension
        run: npm run compile

      - name: Package and validate VSIX contents
        working-directory: FailSafe/extension
        run: |
          npx @vscode/vsce package
          npm run validate:vsix

      - name: Repository validation
        shell: pwsh
        run: |
          pwsh -File scripts/validate.ps1 -SkipContainerValidation

