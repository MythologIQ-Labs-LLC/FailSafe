name: Repo Standards Enforcement

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - "plan/**"
      - "feat/**"
      - "fix/**"
      - "release/**"
      - "hotfix/**"

# Least-privilege default token: these gates only read the repo and
# build/validate; none mutate repo state. #90 supply-chain baseline.
permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: FailSafe/extension
        run: npm ci

      - name: Branch policy
        shell: pwsh
        run: |
          pwsh -File tools/reliability/validate-branch-policy.ps1

      - name: Ledger fork guard
        working-directory: FailSafe/extension
        run: npm run governance:ledger-fork

      - name: Lint
        working-directory: FailSafe/extension
        run: npm run lint

      - name: Compile
        working-directory: FailSafe/extension
        run: npm run compile

      - name: Package and validate VSIX contents
        working-directory: FailSafe/extension
        run: |
          # #502: a VSIX that depends on better-sqlite3 must be platform-targeted.
          node scripts/package-target.cjs linux-x64 --out standards-linux-x64.vsix
          node scripts/validate-vsix.cjs standards-linux-x64.vsix

      - name: Repository validation
        shell: pwsh
        run: |
          pwsh -File scripts/validate.ps1 -SkipContainerValidation

