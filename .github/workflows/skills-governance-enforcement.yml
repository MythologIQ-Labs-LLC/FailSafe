name: Skills Governance Enforcement

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - "FailSafe/VSCode/skills/**"
      - ".agent/skills/**"
      - "tools/reliability/validate-skill-metadata.ps1"
      - "tools/skills/sync-global-codex-skills.ps1"
      - ".github/workflows/skills-governance-enforcement.yml"
  push:
    branches:
      - "main"
      - "release/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "FailSafe/VSCode/skills/**"
      - ".agent/skills/**"
      - "tools/reliability/validate-skill-metadata.ps1"
      - "tools/skills/sync-global-codex-skills.ps1"
      - ".github/workflows/skills-governance-enforcement.yml"

# Least-privilege default token: these gates only read the repo and
# build/validate; none mutate repo state. #90 supply-chain baseline.
permissions:
  contents: read

jobs:
  skills-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate skill metadata and parity
        shell: pwsh
        run: |
          pwsh -File tools/reliability/validate-skill-metadata.ps1
