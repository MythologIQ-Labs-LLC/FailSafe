name: VSIX Proprietary Guardrails

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Least-privilege default token: these gates only read the repo and
# build/validate; none mutate repo state. #90 supply-chain baseline.
permissions:
  contents: read

jobs:
  verify-vsix-guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FailSafe/extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: FailSafe/extension

      # #502: the shipped VSIXs are platform-targeted (better-sqlite3 13 N-API
      # prebuild per target); scan one built the same way, not a universal VSIX
      # that is never published.
      - name: Package VSIX
        run: node scripts/package-target.cjs linux-x64 --out guardrails-linux-x64.vsix
        working-directory: FailSafe/extension

      - name: Scan VSIX for prohibited content
        working-directory: FailSafe/extension
        run: |
          VSIX_FILE=guardrails-linux-x64.vsix
          if [ -z "$VSIX_FILE" ]; then
            echo "::error::No VSIX file found"
            exit 1
          fi

          CONTENTS=$(unzip -Z1 "$VSIX_FILE")
          PROHIBITED_PATTERNS=(
            "proprietary/"
            "internal/"
            "private/"
            ".env"
            ".vsce-token"
            ".ovsx-token"
          )

          FOUND=0
          for pattern in "${PROHIBITED_PATTERNS[@]}"; do
            MATCHES=$(echo "$CONTENTS" | grep -i "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Prohibited content found: $pattern"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::VSIX contains prohibited content. Review .vscodeignore."
            exit 1
          fi

          echo "VSIX guardrail check passed: $VSIX_FILE"
